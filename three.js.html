<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_5 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Floating Floral Particles Scene
const scene = new THREE.Scene();
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xfff0e0, 1);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Flower Petals (Simplified as soft pink planes/disks)
const petalsCount = 40;
const petalGeometry = new THREE.CircleGeometry(0.1, 8);
const petalMaterial = new THREE.MeshPhongMaterial({
    color: 0xffd1dc, // Blush pink
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.7
});

const petals = [];
for (let i = 0; i < petalsCount; i++) {
    const petal = new THREE.Mesh(petalGeometry, petalMaterial);
    
    // Random position
    petal.position.set(
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 5
    );
    
    // Random rotation
    petal.rotation.set(
        Math.random() * Math.PI,
        Math.random() * Math.PI,
        Math.random() * Math.PI
    );
    
    // Custom properties for animation
    petal.userData = {
        speed: 0.005 + Math.random() * 0.01,
        rotationSpeed: (Math.random() - 0.5) * 0.02,
        phase: Math.random() * Math.PI * 2
    };
    
    petals.push(petal);
    scene.add(petal);
}

camera.position.z = 5;

function animate() {
    requestAnimationFrame(animate);
    
    petals.forEach(petal => {
        // Fall downwards
        petal.position.y -= petal.userData.speed;
        // Sway side to side
        petal.position.x += Math.sin(Date.now() * 0.001 + petal.userData.phase) * 0.002;
        
        // Rotate
        petal.rotation.x += petal.userData.rotationSpeed;
        petal.rotation.y += petal.userData.rotationSpeed;
        
        // Reset position if it falls out of view
        if (petal.position.y < -5) {
            petal.position.y = 5;
            petal.position.x = (Math.random() - 0.5) * 10;
        }
    });
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const newWidth = container.clientWidth || window.innerWidth;
    const newHeight = container.clientHeight || window.innerHeight;
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(newWidth, newHeight);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_5 -->
</body>
</html>
